<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stylish Profile Page</title>
    <style>
        /* Basic Reset */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        /* Background */
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #6e8efb, #a777e3);
            color: #333;
        }

        /* Profile Container */
        .profile-card {
            width: 350px;
            text-align: center;
            background: #fff;
            border-radius: 12px;
            padding: 2rem;
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
        }

        /* Profile Image */
        .profile-card img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #6e8efb;
            margin-bottom: 1rem;
        }

        /* Name and Title */
        .profile-card h1 {
            font-size: 1.8rem;
            color: #333;
        }
        
        .profile-card h2 {
            font-size: 1.1rem;
            color: #6e8efb;
            font-weight: 300;
            margin-bottom: 1rem;
        }

        /* Bio Text */
        .profile-card p {
            font-size: 1rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 1.5rem;
        }

        /* Social Icons */
        .social-icons {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .social-icons a {
            text-decoration: none;
            color: #6e8efb;
            font-size: 1.4rem;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: #a777e3;
        }

        /* Contact Button */
        .profile-card button {
            padding: 0.6rem 1.5rem;
            border: none;
            border-radius: 6px;
            background-color: #6e8efb;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
            transition: background-color 0.3s;
        }

        .profile-card button:hover {
            background-color: #a777e3;
        }
    </style>
</head>
<body>

<div class="profile-card">
    <img src="https://via.placeholder.com/120" alt="Profile Picture">
    <h1>Jane Doe</h1>
    <h2>Web Developer</h2>
    <p>Creative web developer with a passion for creating elegant, intuitive user experiences. Specializing in front-end development and always exploring new design trends.</p>
    
    <div class="social-icons">
        <a href="#" aria-label="Twitter">&#x1F426;</a>
        <a href="#" aria-label="LinkedIn">&#128100;</a>
        <a href="#" aria-label="GitHub">&#128187;</a>
    </div>

    <button>Contact Me</button>
</div>

</body>
</html>
